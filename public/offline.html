<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интернет жоқ — Beles education</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F7FB; color: #0E1424; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 380px; text-align: center; }
  img { height: 36px; }
  h1 { font-size: 22px; margin: 28px 0 8px; }
  p { color: #687085; line-height: 1.5; margin: 0 0 24px; }
  button { border: 0; border-radius: 14px; background: #0E1424; color: #fff; font-size: 15px; font-weight: 600; padding: 14px 28px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/beles-logo.png" alt="Beles education">
    <h1>Интернет байланысы жоқ</h1>
    <p>Сынақ пен нәтижелер интернет арқылы жүктеледі. Белгіленген жауаптарың телефонда сақталған — байланыс қалпына келгенде жалғастыр.</p>
    <button onclick="location.reload()">Қайта көру</button>
  </div>
</body>
</html>
